<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1200" viewBox="0 0 1920 1200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6f3ee"/>
      <stop offset="0.55" stop-color="#e6ebe6"/>
      <stop offset="1" stop-color="#9fc2bc"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="deep" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3f7c76"/>
      <stop offset="1" stop-color="#173b38"/>
    </linearGradient>
    <linearGradient id="enamel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.6" stop-color="#f3f5f2"/>
      <stop offset="1" stop-color="#d9e4e0"/>
    </linearGradient>
    <radialGradient id="pool" cx="1620" cy="1080" r="900" gradientUnits="userSpaceOnUse" gradientTransform="translate(1620 1080) scale(1 0.6) translate(-1620 -1080)">
      <stop offset="0" stop-color="#173b38"/>
      <stop offset="0.45" stop-color="#2f6560" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#3f7c76" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="40" stdDeviation="40" flood-color="#173b38" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="1920" height="1200" fill="url(#bg)"/>
  <circle cx="420" cy="260" r="420" fill="url(#glow)"/>
  <rect width="1920" height="1200" fill="url(#pool)"/>
  <!-- concentric arcs -->
  <g fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="2">
    <circle cx="1380" cy="560" r="360"/>
    <circle cx="1380" cy="560" r="470"/>
    <circle cx="1380" cy="560" r="590" stroke-opacity="0.3"/>
  </g>
  <!-- tooth -->
  <g transform="translate(1180 210) scale(1.0)" filter="url(#soft)">
    <path fill="url(#enamel)" d="M200 40 C140 0 60 10 40 90 C20 170 50 230 80 290 C100 340 100 420 120 460 C135 490 165 480 170 440 C178 390 185 350 200 350 C215 350 222 390 230 440 C235 480 265 490 280 460 C300 420 300 340 320 290 C350 230 380 170 360 90 C340 10 260 0 200 40 Z" transform="scale(1)"/>
    <path fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" opacity="0.9" d="M95 110 C110 70 150 60 180 75"/>
  </g>
  <!-- sparkles -->
  <g fill="#ffffff">
    <path d="M1720 300 l10 30 30 10 -30 10 -10 30 -10 -30 -30 -10 30 -10z"/>
    <path d="M1100 220 l6 18 18 6 -18 6 -6 18 -6 -18 -18 -6 18 -6z" opacity="0.8"/>
  </g>
</svg>
