<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1200" viewBox="0 0 1920 1200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9dbdb7"/>
      <stop offset="0.35" stop-color="#5f918b"/>
      <stop offset="0.75" stop-color="#2a5a55"/>
      <stop offset="1" stop-color="#132e2c"/>
    </linearGradient>
    <radialGradient id="light" cx="380" cy="300" r="760" gradientUnits="userSpaceOnUse" gradientTransform="translate(380 300) scale(1 0.72) translate(-380 -300)">
